<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AUREVN</title>
<style>
  :root { --bg:#0d0b10; --fg:#f4eef6; --dim:#9b90a3; --accent:#e7b7d2; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family:-apple-system, "Segoe UI", Roboto, "Noto Sans", "Malgun Gothic", sans-serif; }
  #bgimg { position:fixed; inset:0; background-size:cover; background-position:center;
           filter:blur(28px) brightness(.35); transform:scale(1.15); z-index:-1; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:14px; letter-spacing:.35em; color:var(--dim); text-align:center; margin:4px 0 16px; font-weight:600; }
  #cover { width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:14px; display:block; background:#222; }
  #title { font-size:22px; font-weight:700; margin:16px 0 2px; }
  #artist { color:var(--dim); font-size:14px; }
  #lyrics { height:130px; margin:18px 0 10px; text-align:center; display:flex; flex-direction:column;
            justify-content:center; gap:8px; }
  #cur { font-size:21px; font-weight:700; line-height:1.35; min-height:1.35em; }
  #nxt { font-size:15px; color:var(--dim); min-height:1.3em; }
  #bar { width:100%; accent-color:var(--accent); }
  .times { display:flex; justify-content:space-between; font-size:12px; color:var(--dim); }
  .ctrl { display:flex; justify-content:center; align-items:center; gap:22px; margin:12px 0 20px; }
  button { background:none; border:0; color:var(--fg); font-size:26px; cursor:pointer; padding:6px; }
  #play { width:64px; height:64px; border-radius:50%; background:var(--fg); color:var(--bg); font-size:26px; }
  #rep { font-size:15px; color:var(--dim); border:1px solid #555; border-radius:16px; padding:4px 12px; }
  #rep.on { color:var(--accent); border-color:var(--accent); }
  ol { list-style:none; padding:0; margin:0; }
  li { display:flex; justify-content:space-between; padding:12px 6px; border-bottom:1px solid #ffffff14; cursor:pointer; }
  li.now { color:var(--accent); font-weight:700; }
  li span:last-child { color:var(--dim); font-size:13px; }
</style>
</head>
<body>
<div id="bgimg"></div>
<main>
  <h1>AUREVN</h1>
  <img id="cover" alt="">
  <div id="title"></div>
  <div id="artist">AUREVN</div>
  <div id="lyrics"><div id="cur"></div><div id="nxt"></div></div>
  <input id="bar" type="range" min="0" max="1000" value="0">
  <div class="times"><span id="t0">0:00</span><span id="t1">0:00</span></div>
  <div class="ctrl">
    <button id="prev" aria-label="previous">⏮</button>
    <button id="play" aria-label="play">▶</button>
    <button id="next" aria-label="next">⏭</button>
    <button id="rep" aria-label="repeat">↻ all</button>
  </div>
  <ol id="list"></ol>
</main>
<audio id="au" preload="metadata"></audio>
<script src="songs.js"></script>
<script>
const S = window.SONGS, au = document.getElementById('au'), $ = id => document.getElementById(id);
let cur = 0, repeatOne = false;
const fmt = s => { s = Math.floor(s || 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

S.forEach((s, i) => {
  const li = document.createElement('li');
  li.innerHTML = '<span></span><span>' + fmt(s.sec) + '</span>';
  li.firstChild.textContent = (i + 1) + '. ' + s.title;
  li.onclick = () => { load(i); au.play(); };
  $('list').appendChild(li);
});

function load(i) {
  cur = (i + S.length) % S.length;
  const s = S[cur];
  au.src = s.audio;
  $('title').textContent = s.title;
  $('cover').src = s.img || '';
  $('bgimg').style.backgroundImage = s.img ? 'url("' + s.img + '")' : 'none';
  $('cur').textContent = ''; $('nxt').textContent = s.lyrics.length ? s.lyrics[0].x : '';
  [...$('list').children].forEach((li, j) => li.classList.toggle('now', j === cur));
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: s.title, artist: 'AUREVN',
      artwork: s.img ? [{ src: s.img, sizes: '1280x720', type: 'image/jpeg' }] : [] });
  }
}

function lyric(t) {
  const L = S[cur].lyrics;
  let k = -1;
  for (let i = 0; i < L.length; i++) { if (L[i].t <= t + 0.15) k = i; else break; }
  $('cur').textContent = k >= 0 ? L[k].x : '';
  $('nxt').textContent = k + 1 < L.length ? L[k + 1].x : '';
}

au.ontimeupdate = () => {
  if (au.duration) $('bar').value = au.currentTime / au.duration * 1000;
  $('t0').textContent = fmt(au.currentTime); $('t1').textContent = fmt(au.duration);
  lyric(au.currentTime);
};
au.onplay = () => $('play').textContent = '❚❚';
au.onpause = () => $('play').textContent = '▶';
au.onended = () => { if (repeatOne) { au.currentTime = 0; au.play(); } else { load(cur + 1); au.play(); } };
$('bar').oninput = e => { if (au.duration) au.currentTime = e.target.value / 1000 * au.duration; };
$('play').onclick = () => au.paused ? au.play() : au.pause();
$('prev').onclick = () => { if (au.currentTime > 3) au.currentTime = 0; else { load(cur - 1); au.play(); } };
$('next').onclick = () => { load(cur + 1); au.play(); };
$('rep').onclick = () => { repeatOne = !repeatOne; $('rep').textContent = repeatOne ? '↻ one' : '↻ all'; $('rep').classList.toggle('on', repeatOne); };
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('previoustrack', () => $('prev').onclick());
  navigator.mediaSession.setActionHandler('nexttrack', () => $('next').onclick());
}
load(0);
</script>
</body>
</html>
